<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <title>ELMS | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="header">
    <span class="logo-text">ELMS</span>
    <span class="app-title">Employee Leave Management System</span>
  </div>

  <div class="content" style="display:flex;justify-content:center;align-items:center;height:80vh;">
    <div class="form-box">
      <h2>Login</h2>

      <input
        type="text"
        id="username"
        placeholder="Username"
      />

      <select id="role">
        <option value="EMPLOYEE">Employee</option>
        <option value="MANAGER">Manager</option>
        <option value="ADMIN">Admin</option>
      </select>

      <button id="loginBtn" type="button">Login</button>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const loginBtn = document.getElementById("loginBtn");

      loginBtn.addEventListener("click", () => {
        const username = document.getElementById("username").value.trim();
        const role = document.getElementById("role").value;

        if (!username) {
          alert("Please enter username");
          return;
        }

        localStorage.setItem("username", username);
        localStorage.setItem("userRole", role);

        window.location.href = "dashboard.html";
      });
    });
  </script>

</body>
</html>
