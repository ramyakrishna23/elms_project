name: ELMS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build backend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/elms-backend:latest ./backend

      - name: Build frontend
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/elms-frontend:latest ./frontend

      - name: Push backend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/elms-backend:latest

      - name: Push frontend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/elms-frontend:latest

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/elms-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/elms-frontend:latest

            docker stop elms-backend elms-frontend || true
            docker rm elms-backend elms-frontend || true

            docker run -d -p 5000:5000 --name elms-backend \
              ${{ secrets.DOCKER_USERNAME }}/elms-backend:latest

            docker run -d -p 3000:80 --name elms-frontend \
              ${{ secrets.DOCKER_USERNAME }}/elms-frontend:latest
